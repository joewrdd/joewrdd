name: GitHub cards

# Redraws assets/github-activity.svg and assets/contributions.svg once a day (and on demand).
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/github_cards.py, scripts/kit.py]

permissions:
  contents: write

concurrency:
  group: github-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/github_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the cards if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg assets/contributions.svg
          git diff --cached --quiet || { git commit -m "Refresh GitHub cards" && git push; }
